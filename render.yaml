services:
  - type: web
    name: ubumwehouse
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: ubumwehouse-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_URL
        value: https://ubumwehouse-prod.onrender.com,https://ubumwehouse.netlify.app
      - key: DB_PATH
        value: /data/rental_management.db
      - key: PERSISTENT_DB_ROOT
        value: /data
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: BACKUP_DIR
        value: /data/secure-backups
      - key: BACKUPS_ENABLED
        value: true
      - key: BACKUP_KEEP_COUNT
        value: 14
      - key: BACKUP_INTERVAL_HOURS
        value: 24
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: VITE_API_BASE_URL
        value: /api
      - key: WHATSAPP_REMINDERS_ENABLED
        value: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v20.0
      - key: WHATSAPP_COMPANY_NAME
        value: UBUMWE SYSTEM COMPANY
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: 250
      - key: WHATSAPP_DEFAULT_DUE_DATE
        value: month end
      - key: WHATSAPP_REMINDER_DAYS_BEFORE
        value: 3
      - key: WHATSAPP_REMINDER_INTERVAL_HOURS
        value: 24
      - key: ALLOW_DEV_TOKEN
        value: false
      - key: VAPID_PUBLIC_KEY
        value: BAe8XGZc5F4uZKVXdPtZhrRizEL-xABL1ZJRHAcvtdZd35VpMoyI_Q0RToC2LUomF8kL3nCkD_I8q92nK9DamS4
      - key: VAPID_EMAIL
        value: mailto:ubumwehouseltd@gmail.com
      - key: VAPID_PRIVATE_KEY
        value: pAYNDI7xaQOAFEy0hXmADtSxSB0_86xcynfVqjXdZIs
