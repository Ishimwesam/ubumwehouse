<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="refresh" content="0.15; url=/tenant-portal" />
    <title>UBUMWE HOUSE LTD TENANT PORTAL</title>
    <style>
      :root {
        color-scheme: light;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: linear-gradient(180deg, #f8fafc 0%, #edf4f7 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: #0f172a;
      }
      body {
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      .card {
        width: min(440px, 100%);
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(219, 228, 239, 0.95);
        border-radius: 18px;
        box-shadow: 0 22px 50px rgba(15, 23, 42, 0.11);
        padding: 28px 22px;
      }
      .brand {
        display: inline-block;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #1e40af;
        margin-bottom: 10px;
      }
      h1 {
        margin: 0;
        font-size: clamp(24px, 6vw, 36px);
        line-height: 1.08;
      }
      p {
        margin: 10px 0 0;
        color: #64748b;
        line-height: 1.5;
        font-size: 15px;
      }
      .hint {
        margin-top: 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 800;
      }
      .dots {
        display: inline-flex;
        gap: 5px;
      }
      .dots span {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #1d4ed8;
        animation: bounce 0.9s ease-in-out infinite alternate;
      }
      .dots span:nth-child(2) { animation-delay: 0.12s; }
      .dots span:nth-child(3) { animation-delay: 0.24s; }
      @keyframes bounce {
        from { transform: translateY(2px); opacity: 0.45; }
        to { transform: translateY(-2px); opacity: 1; }
      }
      a {
        color: inherit;
      }
    </style>
    <script>
      setTimeout(() => {
        window.location.replace('/tenant-portal');
      }, 150);
    </script>
  </head>
  <body>
    <main class="card" aria-label="UBUMWE HOUSE LTD tenant portal loading screen">
      <div class="brand">UBUMWE HOUSE LTD TENANT PORTAL</div>
      <h1>UBUMWE HOUSE LTD Tenant Portal</h1>
      <p>Opening your tenant account and bringing up the form now.</p>
      <div class="hint">
        <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
        Loading portal
      </div>
      <p style="margin-top: 14px; font-size: 13px;">
        If it does not continue automatically, <a href="/tenant-portal">open the tenant portal</a>.
      </p>
    </main>
  </body>
</html>
