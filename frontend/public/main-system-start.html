<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="refresh" content="0.15; url=/" />
    <title>UBUMWE System</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #f8fafc 0%, #edf4f7 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #0f172a;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(440px, 100%);
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid rgba(219, 228, 239, 0.95);
        border-radius: 18px;
        box-shadow: 0 22px 50px rgba(15, 23, 42, 0.11);
        padding: 28px 22px;
        text-align: center;
      }
      .brand {
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #1e40af;
      }
      h1 {
        margin: 10px 0 0;
        font-size: clamp(24px, 6vw, 34px);
        line-height: 1.08;
      }
      p {
        margin: 10px 0 0;
        color: #64748b;
        line-height: 1.5;
      }
    </style>
    <script>
      setTimeout(() => {
        window.location.replace('/');
      }, 150);
    </script>
  </head>
  <body>
    <main class="card" aria-label="UBUMWE system loading screen">
      <div class="brand">UBUMWE SYSTEM COMPANY</div>
      <h1>UBUMWE System</h1>
      <p>Opening the main system now.</p>
      <p style="font-size:13px">If it does not continue, <a href="/">open the system</a>.</p>
    </main>
  </body>
</html>
