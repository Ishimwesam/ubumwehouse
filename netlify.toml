[build]
  command = "npm run build"
  publish = "frontend/dist"

[[headers]]
  for = "/tenant-portal.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/tenant-portal-sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/api/*"
  to = "https://ubumwehouse-prod.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://ubumwehouse-prod.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://ubumwehouse-prod.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
