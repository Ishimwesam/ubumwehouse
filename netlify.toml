[build]
  command = "npm run build"
  publish = "frontend/dist"

[[redirects]]
  from = "/api/*"
  to = "https://ubumwehouse-prod.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://ubumwehouse-prod.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://ubumwehouse-prod.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
